<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 地面 -->
  <rect x="0" y="430" width="512" height="82" fill="#0f172a" opacity="0.55"/>

  <!-- 冷却塔（双曲线剪影） -->
  <path d="M 156 430 Q 175 320 178 200 L 334 200 Q 337 320 356 430 Z"
        fill="url(#tower)"/>

  <!-- 塔顶开口 -->
  <ellipse cx="256" cy="200" rx="78" ry="13" fill="#94a3b8"/>

  <!-- 蒸汽 -->
  <ellipse cx="220" cy="162" rx="38" ry="22" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="292" cy="140" rx="50" ry="26" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="256" cy="105" rx="60" ry="28" fill="#ffffff" opacity="0.35"/>

  <!-- 闪电 -->
  <path d="M 400 60 L 340 200 L 380 200 L 330 330 L 430 170 L 385 170 L 440 60 Z"
        fill="#fbbf24" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
</svg>
